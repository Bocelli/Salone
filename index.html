<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenota Online - Salone Donna & Style</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 16px; color: #0f172a; }
.box { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
.head { background: linear-gradient(135deg, #4f46e5, #ec4899); color: #fff; padding: 28px 20px; text-align: center; }
.head h1 { margin: 0; font-size: 1.5rem; }
.body { padding: 20px; }
label { display: block; font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; margin-bottom: 14px; box-sizing: border-box; }
.srv-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
.btn { width: 100%; padding: 14px; background: #25D366; color: #fff; font-weight: 800; border: none; border-radius: 12px; font-size: 1.05rem; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <div class="head">
    <h1>✂️ Salone Donna & Style</h1>
    <p style="margin:6px 0 0; opacity:0.9;">Prenota il tuo appuntamento in pochi secondi</p>
  </div>
  <div class="body">
    <label>Il tuo Nome e Cognome</label>
    <input type="text" id="c-name" placeholder="Es. Maria Rossi">
    <label>Il tuo Telefono</label>
    <input type="tel" id="c-phone" placeholder="Es. 3331234567">
    <label>Scegli i Servizi dal Listino:</label>
    <div id="srv-list" style="margin-bottom:14px;"></div>
    <label>Giorno desiderato</label>
    <input type="date" id="c-date">
    <label>Orario preferito</label>
    <input type="time" id="c-time" value="10:00">
    <div style="background:#f1f5f9; padding:12px; border-radius:10px; margin-bottom:16px; display:flex; justify-content:space-between; font-weight:700;">
      <span>Totale indicativo:</span>
      <span id="c-tot">€ 0,00</span>
    </div>
    <button class="btn" onclick="sendWA()">📲 Invia Richiesta su WhatsApp</button>
  </div>
</div>
<script>
const services = [{"id":1,"name":"Piega Classica","cat":"Taglio & Piega","price":18,"duration":35},{"id":2,"name":"Taglio Donna","cat":"Taglio & Piega","price":22,"duration":30},{"id":3,"name":"Taglio + Piega","cat":"Taglio & Piega","price":35,"duration":60},{"id":4,"name":"Colore Ricrescita","cat":"Colore & Tecnici","price":30,"duration":45},{"id":5,"name":"Balayage / Schiariture","cat":"Colore & Tecnici","price":65,"duration":120},{"id":6,"name":"Tonalizzante / Gloss","cat":"Colore & Tecnici","price":20,"duration":25},{"id":7,"name":"Trattamento Ristrutturante Cheratina","cat":"Trattamenti","price":25,"duration":20}];
const ownerPhone = "393330000000";
document.getElementById('c-date').value = new Date().toISOString().split('T')[0];
const list = document.getElementById('srv-list');
list.innerHTML = services.map(s => `
  <label class="srv-item">
    <span><input type="checkbox" value="${s.name}" data-price="${s.price}" onchange="calc()" style="width:auto; margin-right:8px;"> ${s.name} (${s.duration} min)</span>
    <strong>€ ${s.price}</strong>
  </label>
`).join('');
function calc() {
  let t = 0;
  document.querySelectorAll('#srv-list input:checked').forEach(c => t += Number(c.dataset.price));
  document.getElementById('c-tot').innerText = '€ ' + t.toFixed(2);
  return t;
}
function sendWA() {
  const name = document.getElementById('c-name').value.trim();
  const phone = document.getElementById('c-phone').value.trim();
  const date = document.getElementById('c-date').value;
  const time = document.getElementById('c-time').value;
  const srvs = Array.from(document.querySelectorAll('#srv-list input:checked')).map(c => c.value);
  if (!name || srvs.length === 0) return alert('Inserisci il tuo nome e scegli almeno un servizio!');
  const tot = calc();
  const msg = `PRENOTAZIONE SALONE
Cliente: ${name}
Tel: ${phone}
Data: ${date}
Ora: ${time}
Servizi: ${srvs.join(', ')}
Totale: ${tot}`;
  window.open('https://wa.me/' + ownerPhone + '?text=' + encodeURIComponent(msg), '_blank');
}
</script>
</body>
</html>
